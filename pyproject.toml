[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-agent-engineering-skills"
version = "0.1.0"
description = "Production-oriented engineering skills and validation tools for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mr.Cheeku" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]
ai-example = ["anthropic>=0.40"]
mcp-example = ["mcp>=2.0,<3"]
home-assistant-example = ["httpx>=0.27"]
username-cli = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
