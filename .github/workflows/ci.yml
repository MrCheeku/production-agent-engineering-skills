name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,ai-example,mcp-example]"
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Check local Markdown links
        run: python scripts/check_links.py
      - name: Lint
        run: ruff check .
      - name: Tests and coverage gate
        run: pytest --cov=agent_skills.validators --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-validator-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
